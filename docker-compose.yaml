networks:
  app-network:
    driver: bridge

services:
  db:
    image: 'postgres:18-alpine'
    volumes:
      - ./db/:/var/lib/postgresql/18/docker:Z
    env_file:
      - ./prod.env
    networks:
      - app-network

  backend:
    image: sevdiumut/hive
    env_file:
      - ./prod.env
    networks:
      - app-network
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    image: sevdiumut/hive-fe
    ports:
      - '80:3000'
    environment:
      - SERVER_URL=http://backend:8080
      - CLIENT_BASE_URL=http://localhost:8080
      - ALLOWED_ORIGINS=localhost:*
    depends_on:
      - backend
    networks:
      - app-network
