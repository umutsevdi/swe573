
networks:
  app-tier:
    driver: bridge

services:
  db:
    image: 'postgres:latest'
    ports:
      - "5432:5432"
    volumes:
      - ${PWD}/db/test:/var/lib/postgresql/19/data/
    env_file:
      - .env
    networks:
      - app-tier
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks:
      - app-tier
