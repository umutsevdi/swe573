
networks:
  app-network:
    driver: bridge

services:
  db:
    image: 'postgres:18-alpine'
    volumes:
      - /data/app/hive/db/:/var/lib/postgresql/19/data:Z
    env_file:
      - Hive/prod.env
    networks:
      - app-network

  backend:
    image: sevdiumut/hive
    env_file:
      - ./prod.env
    networks:
      - app-network
    ports:
      - "8080:8080"

  frontend:
    image: sevdiumut/hive-fe
    ports:
      - '3000:3000'
    environment:
      - VITE_SERVER_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - app-network
