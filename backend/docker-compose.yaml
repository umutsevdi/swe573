
networks:
  app-tier:
    driver: bridge

services:
  db:
    image: 'postgres:18-alpine'
    volumes:
      - ./Hive/db/live:/var/lib/postgresql/19/data:Z
    env_file:
      - Hive/prod.env
    networks:
      - app-tier
  app:
    image: sevdiumut/hive
    env_file:
      - Hive/prod.env
    networks:
      - app-tier
    ports:
      - "8080:8080"
