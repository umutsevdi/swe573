
networks:
  app-tier:
    driver: bridge

services:
  db:
    image: 'postgres:latest'
    volumes:
      - ${PWD}/Hive/db/live:/var/lib/postgresql/19/data/
    env_file:
      - Hive/live.env
    networks:
      - app-tier
  app:
    image: sevdiumut/hive
    env_file:
      - Hive/live.env
    networks:
      - app-tier
    ports:
      - "8080:8080"
