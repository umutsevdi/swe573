spring:
  config:
    import: optional:file:.env
  application:
    name: Hive
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/postgres
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 32MB
      max-request-size: 6MB
jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}
springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger-ui.html